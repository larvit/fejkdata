x-go: &go
  image: golang:${GO_VERSION:-1.27.1}
  working_dir: /app
  volumes:
    - .:/app
    - gocache:/cache
  environment:
    HOME: /cache
    GOCACHE: /cache/build
    GOMODCACHE: /cache/mod
    REPIN: ${REPIN:-}

services:
  # ./... stops at a nested module: docs/decisions.md#the-modules-develop-in-one-committed-gowork-and-no-published-gomod-carries-a-replace
  test:
    <<: *go
    command: sh -c 'go test -race $$(go list -m -f "{{.Dir}}/...")'

  cover:
    <<: *go
    command: sh -c 'pkgs="$$(go list -m -f "{{.Dir}}/...")" && go test -coverpkg="$$(go list $$pkgs | paste -sd, -)" -coverprofile=/tmp/cover.out $$pkgs && go tool cover -func=/tmp/cover.out | tail -1'

  bench:
    <<: *go
    command: sh -c 'go test -run XXX -bench . -benchmem $$(go list -m -f "{{.Dir}}/...")'

  generate:
    <<: *go
    command: go generate ./...

  vet:
    <<: *go
    command: sh -c 'go vet $$(go list -m -f "{{.Dir}}/...")'

  cyclo:
    <<: *go
    command: go run github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0 -over 14 -ignore _test .

  build:
    <<: *go
    command: sh -c 'go build $$(go list -m -f "{{.Dir}}/...")'

  fmt:
    <<: *go
    command: gofmt -w .

  tidy:
    <<: *go
    command: go mod tidy

  dev:
    <<: *go
    command: sh

  data-import: &python
    image: python:3.14.8-slim
    working_dir: /app
    volumes:
      - .:/app
    entrypoint: python3

  release-tooling:
    <<: *python
    environment:
      PYTHONDONTWRITEBYTECODE: "1"

volumes:
  gocache:
