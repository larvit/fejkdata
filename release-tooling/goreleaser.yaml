# Paths are relative to the release's source checkout; dist/ sits outside it because a
# dist/ inside would make Go stamp the version +dirty.
version: 2

project_name: fejkdata
dist: ../dist

builds:
  - main: ./cmd/fejkdata
    binary: fejkdata
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - DATA-LICENSES.md
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  mode: keep-existing
  replace_existing_artifacts: true

nfpms:
  - package_name: fejkdata
    vendor: Larv IT AB
    homepage: &homepage https://github.com/larvit/fejkdata
    maintainer: Lilleman auf Larv <lilleman@larvit.se>
    description: &description Render locale-aware fake data from JSON templates
    license: &license MIT
    formats: [deb, rpm, apk]
    contents:
      - src: LICENSE
        dst: /usr/share/doc/fejkdata/LICENSE
      - src: DATA-LICENSES.md
        dst: /usr/share/doc/fejkdata/DATA-LICENSES.md

dockers_v2:
  - images:
      - ghcr.io/larvit/fejkdata
    tags:
      - "{{ .Version }}"
      - '{{ if eq .Env.LATEST "true" }}latest{{ end }}'
    dockerfile: ../tooling/release-tooling/image.Dockerfile
    labels:
      org.opencontainers.image.source: *homepage
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: *license

homebrew_casks:
  - name: fejkdata
    binaries: [fejkdata]
    homepage: *homepage
    description: *description
    license: *license
    repository:
      owner: larvit
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    skip_upload: '{{ ne .Env.LATEST "true" }}'
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/fejkdata"]
          end

scoops:
  - name: fejkdata
    homepage: *homepage
    description: *description
    license: *license
    repository:
      owner: larvit
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    skip_upload: '{{ ne .Env.LATEST "true" }}'
