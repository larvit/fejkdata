name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  test:
    name: vet + fmt + tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Relevant changes
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            base='${{ github.event.before }}'
          else
            git fetch --no-tags origin "${GITHUB_BASE_REF:-main}"
            base="origin/${GITHUB_BASE_REF:-main}"
          fi
          if git diff --quiet "$base"...HEAD -- '*.go' go.mod go.sum Dockerfile .dockerignore .github data release-tooling testdata vulnerability-filing README.md todo.md; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet "$base"...HEAD -- '*.go' go.mod go.sum release-tooling Dockerfile .dockerignore LICENSE DATA-LICENSES.md .github/workflows/packages.yml .github/workflows/test.yml; then
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG entry for data changes
        run: |
          base='${{ steps.changes.outputs.base }}'
          if ! git diff --quiet "$base"...HEAD -- data testdata/shipped_shape.txt && git diff --quiet "$base"...HEAD -- CHANGELOG.md; then
            echo "::error::the shipped data changed without a CHANGELOG.md entry (see the README's Versioning)"
            exit 1
          fi
      # `docker build` streams the context to the daemon. A compose bind-mount of
      # `.` mounts an empty host dir instead, because the job is itself a container.
      - name: Latest supported Go
        if: ${{ steps.changes.outputs.code == 'true' }}
        run: docker build .
      # Runs even when the step above failed, so a red build says whether the
      # failure is version-specific.
      - name: Lowest supported Go
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        run: docker build --build-arg GO_VERSION=1.22.12 --target portable .
      - name: Package repositories, signed with throwaway keys
        if: ${{ !cancelled() && steps.changes.outputs.packaging == 'true' }}
        run: |
          docker build -f release-tooling/package-repos.Dockerfile --target throwaway-keys --output "$RUNNER_TEMP/keys" .
          PACKAGES_GPG_KEY="$(cat "$RUNNER_TEMP/keys/gpg.asc")" PACKAGES_RSA_KEY="$(cat "$RUNNER_TEMP/keys/rsa.pem")" \
            docker build -f release-tooling/package-repos.Dockerfile --target checks \
            --secret id=gpg,env=PACKAGES_GPG_KEY --secret id=rsa,env=PACKAGES_RSA_KEY .

  vulnerabilities:
    name: Known vulnerabilities in this Go version and the required modules
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      reported: ${{ steps.report.outputs.reported }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch govulncheck's report from vuln.go.dev
        id: report
        run: |
          docker build --no-cache-filter vulnerabilities --target vulnerability-report --output "$RUNNER_TEMP/vulnerabilities" .
          echo "reported=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: vulnerabilities
          path: ${{ runner.temp }}/vulnerabilities/report.json
      - run: python3 vulnerability-filing/file_vulnerabilities.py check "$RUNNER_TEMP/vulnerabilities/report.json"

  release:
    name: Release from CHANGELOG.md, or a patch of the last release for main's Go
    needs: [test, vulnerabilities]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.vulnerabilities.result == 'success' && needs.test.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag || steps.patch.outputs.tag }}
    env:
      FORGE_API_URL: ${{ github.api_url }}
      FORGE_REPOSITORY: ${{ github.repository }}
      FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: vulnerabilities
          path: ${{ runner.temp }}/vulnerabilities
      - id: publish
        run: python3 release-tooling/publish_release.py
        env:
          SHA: ${{ github.sha }}
      - name: Patch the last release when main's Go is a patch above it
        id: patch
        if: steps.publish.outputs.tag == ''
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 release-tooling/patch_release.py cut "$RUNNER_TEMP/vulnerabilities/report.json" todo.md

  plan:
    name: Plan known vulnerabilities, and record fixed ones
    needs: [vulnerabilities, release]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.vulnerabilities.outputs.reported == 'true' && (needs.release.result == 'success' || needs.vulnerabilities.result == 'failure') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      FORGE_API_URL: ${{ github.api_url }}
      FORGE_REPOSITORY: ${{ github.repository }}
      FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: vulnerabilities
          path: ${{ runner.temp }}/vulnerabilities
      - name: Plan known vulnerabilities, and record fixed ones and the last release
        run: |
          git fetch -q --tags origin
          last="$(python3 release-tooling/patch_release.py last)"
          git show "$last:CHANGELOG.md" > "$RUNNER_TEMP/released.md"
          python3 release-tooling/patch_release.py reconcile CHANGELOG.md "$RUNNER_TEMP/released.md"
          python3 vulnerability-filing/file_vulnerabilities.py plan "$RUNNER_TEMP/vulnerabilities/report.json" todo.md CHANGELOG.md --last "$last"
      - name: Propose the plan and the changelog to main
        run: |
          if git diff --quiet todo.md CHANGELOG.md; then
            exit 0
          fi
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -qC security-plan
          git commit -qam "Plan known vulnerabilities, and record fixed ones and the last release"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" security-plan
          if [ "$(gh pr list --head security-plan --state open --json number --jq length)" = 0 ]; then
            gh pr create --head security-plan --title "Plan known vulnerabilities, and record fixed ones and the last release" \
              --body "Plans each module's new known vulnerabilities in todo.md, scored 0.0 until rank_todo.py scores them; moves fixed ones, and any release section main lacks, into CHANGELOG.md. Merges itself once the tests pass."
          fi
          # A push the workflow's token makes starts no workflow.
          gh workflow run test.yml --ref security-plan
          gh pr merge security-plan --auto --rebase

  packages:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
      PACKAGES_RSA_KEY: ${{ secrets.PACKAGES_RSA_KEY }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
