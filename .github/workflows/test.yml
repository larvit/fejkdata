name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  test:
    name: vet + fmt + tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Relevant changes
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            base="origin/$GITHUB_BASE_REF"
          else
            base='${{ github.event.before }}'
          fi
          if git diff --quiet "$base"...HEAD -- '*.go' go.mod go.sum Dockerfile .dockerignore .github data release-tooling testdata vulnerability-filing README.md todo.md; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet "$base"...HEAD -- '*.go' go.mod go.sum release-tooling Dockerfile .dockerignore LICENSE DATA-LICENSES.md .github/workflows/packages.yml .github/workflows/test.yml; then
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG entry for data changes
        run: |
          base='${{ steps.changes.outputs.base }}'
          if ! git diff --quiet "$base"...HEAD -- data testdata/shipped_shape.txt && git diff --quiet "$base"...HEAD -- CHANGELOG.md; then
            echo "::error::the shipped data changed without a CHANGELOG.md entry (see the README's Versioning)"
            exit 1
          fi
      # `docker build` streams the context to the daemon. A compose bind-mount of
      # `.` mounts an empty host dir instead, because the job is itself a container.
      - name: Latest supported Go
        if: ${{ steps.changes.outputs.code == 'true' }}
        run: docker build .
      # Runs even when the step above failed, so a red build says whether the
      # failure is version-specific.
      - name: Lowest supported Go
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        run: docker build --build-arg GO_VERSION=1.22.12 --target portable .
      - name: Package repositories, signed with throwaway keys
        if: ${{ !cancelled() && steps.changes.outputs.packaging == 'true' }}
        run: |
          docker build -f release-tooling/package-repos.Dockerfile --target throwaway-keys --output "$RUNNER_TEMP/keys" .
          PACKAGES_GPG_KEY="$(cat "$RUNNER_TEMP/keys/gpg.asc")" PACKAGES_RSA_KEY="$(cat "$RUNNER_TEMP/keys/rsa.pem")" \
            docker build -f release-tooling/package-repos.Dockerfile --target checks \
            --secret id=gpg,env=PACKAGES_GPG_KEY --secret id=rsa,env=PACKAGES_RSA_KEY .

  vulnerabilities:
    name: Known vulnerabilities in this Go version and the required modules
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      reported: ${{ steps.report.outputs.reported }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch govulncheck's report from vuln.go.dev
        id: report
        run: |
          docker build --no-cache-filter vulnerabilities --target vulnerability-report --output "$RUNNER_TEMP/vulnerabilities" .
          echo "reported=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: vulnerabilities
          path: ${{ runner.temp }}/vulnerabilities/report.json
      - run: python3 vulnerability-filing/file_vulnerabilities.py check "$RUNNER_TEMP/vulnerabilities/report.json"

  security:
    name: Plan known vulnerabilities, and release a Go patch
    needs: [test, vulnerabilities]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.vulnerabilities.outputs.reported == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: vulnerabilities
          path: ${{ runner.temp }}/vulnerabilities
      - name: The patch release main's Go calls for
        id: patch
        if: needs.vulnerabilities.result == 'success' && needs.test.result != 'failure'
        run: |
          base="$(gh release view --json tagName --jq .tagName)"
          git show "$base:Dockerfile" > "$RUNNER_TEMP/Dockerfile.released"
          go="$(python3 release-tooling/patch_release.py go "$RUNNER_TEMP/Dockerfile.released" Dockerfile)"
          if [ -n "$go" ]; then
            {
              echo "base=$base"
              echo "go=$go"
              echo "version=$(python3 release-tooling/patch_release.py version "$base")"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Plan new vulnerabilities, and record fixed ones
        env:
          RELEASE: ${{ steps.patch.outputs.version }}
        run: python3 vulnerability-filing/file_vulnerabilities.py plan "$RUNNER_TEMP/vulnerabilities/report.json" todo.md CHANGELOG.md ${RELEASE:+--release "$RELEASE"}
      - name: Cut the patch release from the last release
        id: cut
        if: steps.patch.outputs.version != ''
        env:
          BASE: ${{ steps.patch.outputs.base }}
          GO: ${{ steps.patch.outputs.go }}
          VERSION: ${{ steps.patch.outputs.version }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git worktree add -q "$RUNNER_TEMP/release" "$BASE"
          python3 release-tooling/patch_release.py apply "$RUNNER_TEMP/release" CHANGELOG.md "$VERSION" "$GO" > "$RUNNER_TEMP/notes.md"
          git -C "$RUNNER_TEMP/release" commit -qam "Release $VERSION, built with Go $GO"
          git -C "$RUNNER_TEMP/release" push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/release/$VERSION"
          gh release create "v$VERSION" --target "release/$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Propose the plan and the changelog to main
        run: |
          if git diff --quiet todo.md CHANGELOG.md || [ "$(gh pr list --head security-plan --state open --json number --jq length)" != 0 ]; then
            exit 0
          fi
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -qC security-plan
          git commit -qam "Plan known vulnerabilities, and record fixed ones"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" security-plan
          gh pr create --head security-plan --title "Plan known vulnerabilities, and record fixed ones" \
            --body "govulncheck's report changed what todo.md plans: new known vulnerabilities are filed atop the next patch release, scored 0.0 until rank_todo.py scores them, and fixed ones move to CHANGELOG.md. It merges itself once the tests pass."
          gh pr merge security-plan --auto --rebase
          # A pull request the workflow's token opens starts no workflow.
          gh workflow run test.yml --ref security-plan

  release:
    name: Release from CHANGELOG.md
    needs: [test, vulnerabilities]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: publish
        run: python3 release-tooling/publish_release.py
        env:
          FORGE_API_URL: ${{ github.api_url }}
          FORGE_REPOSITORY: ${{ github.repository }}
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}

  packages:
    needs: [release, security]
    if: ${{ !cancelled() && (needs.release.outputs.tag != '' || needs.security.outputs.tag != '') }}
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ needs.release.outputs.tag || needs.security.outputs.tag }}
    secrets:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
      PACKAGES_RSA_KEY: ${{ secrets.PACKAGES_RSA_KEY }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
