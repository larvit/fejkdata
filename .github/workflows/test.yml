name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  changes:
    name: Relevant changes, and the changelog entry for data changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.changes.outputs.code }}
      packaging: ${{ steps.changes.outputs.packaging }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Whether the files the build reads, and the files a release packages, changed
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            base='${{ github.event.before }}'
          else
            git fetch --no-tags origin "${GITHUB_BASE_REF:-main}"
            base="origin/${GITHUB_BASE_REF:-main}"
          fi
          echo "base=$base" >> "$GITHUB_ENV"
          changed() { git diff --quiet "$base"...HEAD -- "$@" && echo false || echo true; }
          {
            echo "code=$(changed '*.go' go.mod go.sum Dockerfile .dockerignore .github data dockerhub release-tooling renovate.json testdata vulnerability-filing README.md todo.md)"
            echo "packaging=$(changed '*.go' go.mod go.sum release-tooling Dockerfile .dockerignore LICENSE DATA-LICENSES.md .github/workflows)"
          } >> "$GITHUB_OUTPUT"
      - name: CHANGELOG entry for data changes
        run: |
          if ! git diff --quiet "$base"...HEAD -- data testdata/shipped_shape.txt && git diff --quiet "$base"...HEAD -- CHANGELOG.md; then
            echo "::error::the shipped data changed without a CHANGELOG.md entry (see the README's Versioning)"
            exit 1
          fi

  test:
    name: vet + fmt + tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          cleanup: false
      # Only a push to main saves the caches, and a pull request starts from main's.
      - name: Go's build and module caches, kept by main's runs
        if: github.event_name == 'push'
        uses: actions/cache@v6
        with: &go-caches
          path: ${{ runner.temp }}/go-caches
          key: go-caches-${{ github.sha }}
          restore-keys: go-caches-
      - name: Go's build and module caches from main's last run
        if: github.event_name != 'push'
        uses: actions/cache/restore@v6
        with: *go-caches
      - name: The caches into the Dockerfile's cache mount, and back out after a push
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: '{"${{ runner.temp }}/go-caches": "/cache"}'
          skip-extraction: ${{ github.event_name != 'push' }}
      # `docker build` streams the context to the daemon. A compose bind-mount of
      # `.` mounts an empty host dir instead, because the job is itself a container.
      - name: Latest and lowest supported Go
        run: docker buildx build --builder '${{ steps.buildx.outputs.name }}' .

  packages-dry-run:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.packaging == 'true'
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    uses: ./.github/workflows/packages.yml

  # main's one required check, and what a push to main must pass to release. A skipped required check counts as passed, so the gate runs even after a failure.
  gate:
    name: gate
    needs: [changes, test, packages-dry-run]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    steps:
      - name: The changes and changelog check passed, and the tests and the Packages dry run passed or had nothing to check
        env:
          CHANGES: ${{ needs.changes.result }}
          TESTS: ${{ needs.test.result }}
          DRY_RUN: ${{ needs.packages-dry-run.result }}
        run: |
          echo "changes and changelog check: $CHANGES, tests: $TESTS, Packages dry run: $DRY_RUN"
          [ "$CHANGES" = success ] && { [ "$TESTS" = success ] || [ "$TESTS" = skipped ]; } && { [ "$DRY_RUN" = success ] || [ "$DRY_RUN" = skipped ]; }

  vulnerabilities:
    name: Known vulnerabilities in this Go version and the required modules
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      reported: ${{ steps.report.outputs.reported }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch govulncheck's report from vuln.go.dev
        id: report
        run: |
          docker build --no-cache-filter vulnerabilities --target vulnerability-report --output "$RUNNER_TEMP/vulnerabilities" .
          echo "reported=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: vulnerabilities
          path: ${{ runner.temp }}/vulnerabilities/report.json
      - run: python3 vulnerability-filing/file_vulnerabilities.py check "$RUNNER_TEMP/vulnerabilities/report.json"

  release:
    name: Release from CHANGELOG.md, or a patch of the last release for what main carries
    needs: [gate, vulnerabilities]
    # The daily run skips the gate: a skipped gate doesn't stop a release, a failed one does.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.vulnerabilities.result == 'success' && needs.gate.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag || steps.patch.outputs.tag }}
    env:
      FORGE_API_URL: ${{ github.api_url }}
      FORGE_REPOSITORY: ${{ github.repository }}
      FORGE_SERVER_URL: ${{ github.server_url }}
      FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: publish
        if: github.event_name == 'push'
        run: python3 release-tooling/publish_release.py
        env:
          SHA: ${{ github.sha }}
      - name: Patch the last release when main carries a newer Go, newer modules or another GoReleaser
        id: patch
        if: steps.publish.outputs.tag == ''
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 release-tooling/patch_release.py cut

  plan:
    name: Plan known vulnerabilities, and record fixed ones and new Go minors' Breaking lines
    needs: [vulnerabilities, release]
    # Runs after a failed release job too: a patch waiting for a human fails it, and fixed items still move.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.vulnerabilities.outputs.reported == 'true' && (needs.release.result == 'success' || needs.release.result == 'failure' || needs.vulnerabilities.result == 'failure') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: security-plan
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      FORGE_API_URL: ${{ github.api_url }}
      FORGE_REPOSITORY: ${{ github.repository }}
      FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: vulnerabilities
          path: ${{ runner.temp }}/vulnerabilities
      - name: Plan known vulnerabilities, and record fixed ones, the last release and new Go minors' Breaking lines
        run: python3 release-tooling/patch_release.py plan "$RUNNER_TEMP/vulnerabilities/report.json" todo.md CHANGELOG.md
      - name: Propose the plan and the changelog to main
        run: |
          if git diff --quiet todo.md CHANGELOG.md; then
            if [ "$(gh pr list --head security-plan --state open --json number --jq length)" != 0 ]; then
              gh pr close security-plan --delete-branch --comment "main already holds what this proposed."
            fi
            exit 0
          fi
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -qC security-plan
          git commit -qam "Plan known vulnerabilities, and record fixed ones, the last release and new Go minors' Breaking lines"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" security-plan
          if [ "$(gh pr list --head security-plan --state open --json number --jq length)" = 0 ]; then
            gh pr create --head security-plan --title "Plan known vulnerabilities, and record fixed ones, the last release and new Go minors' Breaking lines" \
              --body "Plans each module's new known vulnerabilities in todo.md, scored 0.0 until rank_todo.py scores them; moves fixed ones, any release section main lacks and each new Go minor's Breaking lines into CHANGELOG.md. Merges itself once the tests pass."
          fi
          # GitHub holds the pull_request run of a pull request this token opens until it is approved.
          sha="$(git rev-parse HEAD)"
          run=""
          for _ in $(seq 24); do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&head_sha=${sha}" --jq '[.workflow_runs[] | select(.head_repository.full_name == env.GITHUB_REPOSITORY)][0] // empty | "\(.id) \(.conclusion)"')"
            [ -n "$run" ] && break
            sleep 5
          done
          if [ -z "$run" ]; then
            echo "::error::no pull_request run for ${sha}; its required check will never report"
            exit 1
          fi
          if [ "${run#* }" = action_required ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run%% *}/approve"
          fi
          gh pr merge security-plan --auto --rebase

  packages:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
      PACKAGES_RSA_KEY: ${{ secrets.PACKAGES_RSA_KEY }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
