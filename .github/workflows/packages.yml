name: Packages

on:
  workflow_call:
    inputs:
      tag:
        description: The released tag to package; without one, a dry run builds the checked-out commit, reads no secret and publishes nothing
        type: string
    secrets:
      TAP_GITHUB_TOKEN:
        required: false
      PACKAGES_GPG_KEY:
        required: false
      PACKAGES_RSA_KEY:
        required: false
      DOCKERHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: The released tag to package, such as v0.1.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ inputs.tag && 'packages' || github.run_id }}
  cancel-in-progress: false

jobs:
  packages:
    name: Binaries, packages and image for ${{ inputs.tag || 'a dry run' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      # Check out the packaging config at the workflow's commit, so a tag cut before the
      # config existed can still be packaged.
      - uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false
      - name: The Go version the tag names
        id: go
        run: sed -n 's/^ARG GO_VERSION=/version=/p' src/Dockerfile >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - name: Whether the tag is the latest release
        id: latest
        if: inputs.tag
        env:
          FORGE_API_URL: ${{ github.api_url }}
          FORGE_REPOSITORY: ${{ github.repository }}
          FORGE_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$(python3 tooling/release-tooling/patch_release.py last)" = "$TAG" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfile's packaging stage and package-repos.Dockerfile's snapshot stage pin the same GoReleaser.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          workdir: src
          args: release --clean --config ../tooling/release-tooling/goreleaser.yaml ${{ !inputs.tag && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.latest.outputs.latest }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      # A dry run's image is loaded locally, one per platform, its tag suffixed with the platform.
      - name: The built binary and the image print the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          printed="$(dist/fejkdata_linux_amd64_v1/fejkdata --version)"
          if [ -n "$TAG" ]; then
            test "$printed" = "fejkdata $TAG"
            image="ghcr.io/larvit/fejkdata:${TAG#v}"
          else
            image="ghcr.io/larvit/fejkdata:$(jq -r .version dist/metadata.json)-amd64"
          fi
          test "$(docker run --rm "$image" --version)" = "$printed"
      - uses: actions/upload-artifact@v7
        if: steps.latest.outputs.latest == 'true' || !inputs.tag
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.apk
          retention-days: 1

  dockerhub:
    name: Docker Hub image for ${{ inputs.tag }}
    needs: packages
    if: inputs.tag
    runs-on: ubuntu-26.04
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy the GHCR image to Docker Hub, and check it prints the tag
        env:
          LATEST: ${{ needs.packages.outputs.latest }}
          TAG: ${{ inputs.tag }}
        run: |
          tags=(-t "docker.io/larvit/fejkdata:${TAG#v}")
          if [ "$LATEST" = true ]; then
            tags+=(-t docker.io/larvit/fejkdata:latest)
          fi
          docker buildx imagetools create "${tags[@]}" "ghcr.io/larvit/fejkdata:${TAG#v}"
          test "$(docker run --rm "docker.io/larvit/fejkdata:${TAG#v}" --version)" = "fejkdata $TAG"

  repos:
    name: apt, dnf and apk repositories for ${{ inputs.tag || 'a dry run' }}
    needs: packages
    if: needs.packages.outputs.latest == 'true' || !inputs.tag
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: packages
      - uses: docker/setup-buildx-action@v4
      - name: Install fejkdata from each repository, then export them
        env:
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
          PACKAGES_RSA_KEY: ${{ secrets.PACKAGES_RSA_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            docker buildx build -f release-tooling/package-repos.Dockerfile --target throwaway-keys --output "$RUNNER_TEMP/keys" .
            PACKAGES_GPG_KEY="$(cat "$RUNNER_TEMP/keys/gpg.asc")"
            PACKAGES_RSA_KEY="$(cat "$RUNNER_TEMP/keys/rsa.pem")"
            export PACKAGES_GPG_KEY PACKAGES_RSA_KEY
          fi
          build() {
            docker buildx build -f release-tooling/package-repos.Dockerfile \
              --secret id=gpg,env=PACKAGES_GPG_KEY --secret id=rsa,env=PACKAGES_RSA_KEY \
              --build-context packages=packages --build-arg "EXPECTED_VERSION=$TAG" "$@" .
          }
          build --target checks --output type=local,dest=checks
          build --target site --output type=local,dest=site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  pages:
    name: Deploy the repositories for ${{ inputs.tag }}
    needs: repos
    if: inputs.tag
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
