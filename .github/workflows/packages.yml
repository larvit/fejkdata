name: Packages

on:
  workflow_call:
    inputs:
      tag:
        description: The released tag to package; without one, a dry run builds the checked-out commit, doesn't read a repository secret or publish anything
        type: string
    secrets:
      TAP_GITHUB_TOKEN:
        required: false
      PACKAGES_GPG_KEY:
        required: false
      PACKAGES_RSA_KEY:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      SITE_DEPLOY_TOKEN:
        required: false
    outputs:
      wheels:
        description: "'true' where the release built Python wheels, which a tag cut before the Python package existed doesn't"
        value: ${{ jobs.packages.outputs.wheels }}
  workflow_dispatch:
    inputs:
      tag:
        description: The released tag to package, such as v0.1.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ inputs.tag && 'packages' || github.run_id }}
  cancel-in-progress: false

jobs:
  packages:
    name: Binaries, packages and image for ${{ inputs.tag }}
    if: ${{ !cancelled() && inputs.tag }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
      wheels: ${{ steps.wheels.outputs.built }}
      npm: ${{ steps.npm.outputs.packed }}
    steps: &packages
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      # Check out the packaging config at the workflow's commit, so a tag cut before the
      # config existed can still be packaged.
      - uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false
      - name: Every release secret is set
        if: inputs.tag
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
          PACKAGES_RSA_KEY: ${{ secrets.PACKAGES_RSA_KEY }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for name in TAP_GITHUB_TOKEN PACKAGES_GPG_KEY PACKAGES_RSA_KEY DOCKERHUB_TOKEN; do
            [ -n "${!name}" ] || { echo "::error::$name is not set"; exit 1; }
          done
      - name: The Go version the tag names
        id: go
        run: sed -n 's/^ARG GO_VERSION=/version=/p' src/Dockerfile >> "$GITHUB_OUTPUT"
      # A release saves Go's build and module caches, and a pull request's dry run restores them.
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: true
          cache-dependency-path: src/go.mod
      - name: Whether the tag is the latest release
        id: latest
        if: inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          last="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [ "$last" = "$TAG" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.3
          workdir: src
          args: release --clean --config ../tooling/release-tooling/goreleaser.yaml ${{ !inputs.tag && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ inputs.tag && secrets.GITHUB_TOKEN || '' }}
          LATEST: ${{ steps.latest.outputs.latest }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      # A dry run's image is loaded locally, one per platform, its tag suffixed with the platform.
      - name: The built binary and the image print one version, the tag's in a release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          printed="$(dist/fejkdata_linux_amd64_v1/fejkdata --version)"
          if [ -n "$TAG" ]; then
            test "$printed" = "fejkdata $TAG"
            image="ghcr.io/larvit/fejkdata:${TAG#v}"
          else
            image="ghcr.io/larvit/fejkdata:$(jq -r .version dist/metadata.json)-amd64"
          fi
          test "$(docker run --rm "$image" --version)" = "$printed"
      # A tag cut before the Python package existed holds no python-package/, and builds no wheel.
      - name: A Python wheel per platform passes twine's check, and the Linux amd64 one renders once installed, on glibc and on musl
        id: wheels
        if: hashFiles('src/python-package/**') != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          python3 tooling/release-tooling/python_wheels.py src dist "${version:-0.0.0}" wheels
          python3 -m venv venv
          venv/bin/pip install --no-index wheels/*manylinux*x86_64*.whl
          rendered="$(venv/bin/python -c 'import fejkdata; print(fejkdata.render("{/misc.territory[SE].alpha2}", seed=1, today="2026-01-15"))')"
          test "$rendered" = SE
          # Alpine has musl, and 3.11 is the oldest Python the wheels claim.
          docker run --rm --memory 1g --memory-swap 1g -v "$PWD/wheels:/wheels:ro" python:3.11.15-alpine sh -c \
            'pip install --no-index --find-links /wheels fejkdata && python -c "import fejkdata; assert fejkdata.render(\"{/misc.territory[SE].alpha2}\", seed=1, today=\"2026-01-15\") == \"SE\""'
          python3 -m venv twine
          twine/bin/pip install --no-cache-dir twine==7.0.0
          twine/bin/twine check --strict wheels/*.whl
          for wheel in wheels/*.whl; do
            ls -l "$wheel"
            python3 -m zipfile -l "$wheel"
          done
          echo built=true >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.wheels.outputs.built == 'true'
        with:
          name: python-wheels
          path: wheels/*.whl
          retention-days: ${{ inputs.tag && 90 || 1 }}
      # A tag cut before the npm package existed holds no npm-package/, and packs no tarball.
      - name: The npm package packs under the tag's version, and a dry run of its publish lists its files and size
        id: npm
        if: hashFiles('src/npm-package/**') != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          docker buildx build --target npm-package-built --output npm src
          # npm refuses a dry run too where it holds the version, or a higher one under the same tag.
          docker run --rm --memory 2g --memory-swap 2g --user "$(id -u):$(id -g)" -e HOME=/tmp -e TAG -e VERSION="${version:-0.0.0-dry-run}" -v "$PWD/npm:/npm" -w /npm/npm-package node:26.13.1-slim sh -ec '
            npm version --no-git-tag-version --allow-same-version "$VERSION"
            if [ -z "$TAG" ]; then
              npm publish --dry-run --tag dry-run
            elif [ -z "$(npm view "@larvit/fejkdata@$VERSION" version 2>/dev/null)" ]; then
              npm publish --dry-run --tag dry-run
            fi
            npm pack --pack-destination /npm'
          tar -tzf npm/larvit-fejkdata-*.tgz | sort > npm/packed
          printf 'package/%s\n' DATA-LICENSES.md LICENSE README.md WORDNET-LICENSE.txt fejkdata.wasm index.d.ts index.js package.json shipped-paths.d.ts wasm_exec.js | diff - npm/packed
          echo packed=true >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.npm.outputs.packed == 'true'
        with:
          name: npm-package
          path: npm/larvit-fejkdata-*.tgz
          retention-days: ${{ inputs.tag && 90 || 1 }}
      - uses: actions/upload-artifact@v7
        if: steps.latest.outputs.latest == 'true' || !inputs.tag
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.apk
          retention-days: ${{ inputs.tag && 90 || 1 }}

  packages-dry-run:
    name: Binaries, packages and image for a dry run
    if: '!inputs.tag'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps: *packages

  wheels:
    name: The Python wheel installs and renders on ${{ matrix.runner }}
    needs: [packages, packages-dry-run]
    # One of packages and packages-dry-run always skips: see repos.
    if: ${{ !cancelled() && !failure() && (needs.packages.outputs.wheels == 'true' || !inputs.tag) }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04-arm, macos-15-intel, macos-26, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-wheels
          path: wheels
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: pip picks this platform's wheel, and it renders
        shell: bash
        run: |
          python -m pip install --no-index --find-links wheels fejkdata
          python -c 'import fejkdata; assert fejkdata.render("{/misc.territory[SE].alpha2}", seed=1, today="2026-01-15") == "SE"'
      - name: The same on musl
        if: matrix.runner == 'ubuntu-26.04-arm'
        run: |
          docker run --rm --memory 1g --memory-swap 1g -v "$PWD/wheels:/wheels:ro" python:3.11.15-alpine sh -c \
            'pip install --no-index --find-links /wheels fejkdata && python -c "import fejkdata; assert fejkdata.render(\"{/misc.territory[SE].alpha2}\", seed=1, today=\"2026-01-15\") == \"SE\""'

  npm:
    name: The npm package on npmjs.com for ${{ inputs.tag }}
    needs: packages
    # npm takes the calling workflow, test.yml, as the package's trusted publisher, so a run of this workflow started by hand doesn't publish.
    if: ${{ needs.packages.outputs.npm == 'true' && contains(github.workflow_ref, '/test.yml@') }}
    runs-on: ubuntu-26.04
    # npm's trusted publishing needs npm 11.5.1 or later and Node 22.14 or later.
    container: node:26.13.1-slim
    environment:
      name: npm
      url: https://www.npmjs.com/package/@larvit/fejkdata
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: npm
      # npm refuses a version it already holds, so a rerun skips what an earlier attempt published.
      - name: Publish the tarball, unless npmjs.com already holds its version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$(npm view "@larvit/fejkdata@${TAG#v}" version 2>/dev/null)" ]; then
            echo "::notice::npmjs.com already holds ${TAG#v}"
            exit 0
          fi
          # npm refuses a version below its latest under the tag latest, so a late rerun of an older release takes another tag.
          latest="$(npm view @larvit/fejkdata version 2>/dev/null)"
          if [ "$(printf '%s\n' "$latest" "${TAG#v}" | sort -V | tail -n 1)" = "${TAG#v}" ]; then
            npm publish ./npm/larvit-fejkdata-*.tgz
          else
            npm publish --tag previous ./npm/larvit-fejkdata-*.tgz
          fi

  dockerhub:
    name: Docker Hub image for ${{ inputs.tag }}
    needs: packages
    if: ${{ !cancelled() && needs.packages.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy the GHCR image to Docker Hub, and check it prints the tag
        env:
          LATEST: ${{ needs.packages.outputs.latest }}
          TAG: ${{ inputs.tag }}
        run: |
          tags=(-t "docker.io/larvit/fejkdata:${TAG#v}")
          if [ "$LATEST" = true ]; then
            tags+=(-t docker.io/larvit/fejkdata:latest)
          fi
          docker buildx imagetools create "${tags[@]}" "ghcr.io/larvit/fejkdata:${TAG#v}"
          test "$(docker run --rm "docker.io/larvit/fejkdata:${TAG#v}" --version)" = "fejkdata $TAG"

  repos:
    name: apt, dnf and apk repositories for ${{ inputs.tag || 'a dry run' }}
    needs: [packages, packages-dry-run]
    # One of packages and packages-dry-run always skips, which skips every job after it unless
    # its if: checks the results itself, as this one and pages' do.
    if: ${{ !cancelled() && !failure() && (needs.packages.outputs.latest == 'true' || !inputs.tag) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: packages
      - name: Install fejkdata from each repository, then export them
        env:
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
          PACKAGES_RSA_KEY: ${{ secrets.PACKAGES_RSA_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            docker buildx build -f release-tooling/package-repos.Dockerfile --target throwaway-keys --output "$RUNNER_TEMP/keys" .
            PACKAGES_GPG_KEY="$(cat "$RUNNER_TEMP/keys/gpg.asc")"
            PACKAGES_RSA_KEY="$(cat "$RUNNER_TEMP/keys/rsa.pem")"
            export PACKAGES_GPG_KEY PACKAGES_RSA_KEY
          fi
          build() {
            docker buildx build -f release-tooling/package-repos.Dockerfile \
              --secret id=gpg,env=PACKAGES_GPG_KEY --secret id=rsa,env=PACKAGES_RSA_KEY \
              --build-context packages=packages --build-arg "EXPECTED_VERSION=$TAG" "$@" .
          }
          build --target checks --output type=local,dest=checks
          build --target site --output type=local,dest=site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: ${{ inputs.tag && 90 || 1 }}

  pages:
    name: Deploy the repositories to GitHub Pages
    needs: repos
    if: ${{ !cancelled() && needs.repos.result == 'success' && inputs.tag }}
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  site:
    name: Start fejkdata.dev's deploy of ${{ inputs.tag }}
    needs: packages
    if: ${{ !cancelled() && needs.packages.result == 'success' && needs.packages.outputs.latest == 'true' }}
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      # A failed call only warns, since the release has published.
      - name: Dispatch the site's build workflow with the release
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          [ -n "$SITE_DEPLOY_TOKEN" ] || { echo "::warning::SITE_DEPLOY_TOKEN is not set, so fejkdata.dev keeps its last release"; exit 0; }
          body="$(jq -cn --arg version "$TAG" '{ref: "main", inputs: {version: $version}}')"
          curl --fail-with-body --silent --show-error --max-time 60 --retry 3 \
            --header "Authorization: token $SITE_DEPLOY_TOKEN" --header "Content-Type: application/json" \
            --data "$body" "https://gitea.larvit.se/api/v1/repos/larvit/fejkdata.dev/actions/workflows/build.yml/dispatches" \
            || printf '\n::warning::fejkdata.dev'"'"'s deploy of %s did not start\n' "$TAG"
